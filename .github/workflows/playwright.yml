name: Playwright Runner From GitHub Actions

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: src/filter-properties/database.json
          key: filter-properties-db-${{ github.run_id }}
          restore-keys: |
            filter-properties-db-

      - name: Ensure database.json exists
        run: |
          test -f src/filter-properties/database.json || echo '{}' > src/filter-properties/database.json

      - name: Restore Gazeta Celesi database cache
        uses: actions/cache/restore@v4
        with:
          path: src/filter-properties/database-gazetacelesi.json
          key: filter-properties-gazetacelesi-db-${{ github.run_id }}
          restore-keys: |
            filter-properties-gazetacelesi-db-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          PROPERTY_INGEST_API_KEY=${{ secrets.PROPERTY_INGEST_API_KEY }}
          MJ_APIKEY_PUBLIC=${{ secrets.MJ_APIKEY_PUBLIC }}
          MJ_APIKEY_PRIVATE=${{ secrets.MJ_APIKEY_PRIVATE }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}
          EOF

      - name: Install dependencies
        run: npm ci --prefer-offline
        env:
          # This job only runs Playwright, so skip the Cypress binary download.
          CYPRESS_INSTALL_BINARY: "0"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: >-
          npx playwright test --workers=2
          playwright/e2e/dua-shpi-shitje.spec.js
          playwright/e2e/gazeta-celesi-shitje.spec.js

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/filter-properties/database.json
          key: filter-properties-db-${{ github.run_id }}

      - name: Save Gazeta Celesi database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/filter-properties/database-gazetacelesi.json
          key: filter-properties-gazetacelesi-db-${{ github.run_id }}
