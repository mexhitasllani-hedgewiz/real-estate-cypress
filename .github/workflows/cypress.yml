name: Cypress Runner From GitHub Actions

on:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: src/filter-properties/database.json
          key: filter-properties-db-${{ github.run_id }}
          restore-keys: |
            filter-properties-db-

      - name: Ensure database.json exists
        run: |
          test -f src/filter-properties/database.json || echo '{}' > src/filter-properties/database.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          PROPERTY_INGEST_API_KEY=${{ secrets.PROPERTY_INGEST_API_KEY }}
          MJ_APIKEY_PUBLIC=${{ secrets.MJ_APIKEY_PUBLIC }}
          MJ_APIKEY_PRIVATE=${{ secrets.MJ_APIKEY_PRIVATE }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        run: npx cypress run --spec cypress/e2e/dua-shpi-shitje.cy.js

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/filter-properties/database.json
          key: filter-properties-db-${{ github.run_id }}
