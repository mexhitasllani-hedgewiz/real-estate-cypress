name: Playwright with tunnel

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: src/filter-properties/database.json
          key: filter-properties-db-${{ github.run_id }}
          restore-keys: |
            filter-properties-db-

      - name: Ensure database.json exists
        run: |
          test -f src/filter-properties/database.json || echo '{}' > src/filter-properties/database.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          PROPERTY_INGEST_API_KEY=${{ secrets.PROPERTY_INGEST_API_KEY }}
          MJ_APIKEY_PUBLIC=${{ secrets.MJ_APIKEY_PUBLIC }}
          MJ_APIKEY_PRIVATE=${{ secrets.MJ_APIKEY_PRIVATE }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}
          EOF

      - name: Install dependencies
        run: npm ci --prefer-offline
        env:
          # This job only runs Playwright, so skip the Cypress binary download.
          CYPRESS_INSTALL_BINARY: "0"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Open SSH SOCKS tunnel to droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/droplet
          chmod 600 ~/.ssh/droplet
          ssh -i ~/.ssh/droplet \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -D 127.0.0.1:1080 -N -f "$DROPLET_USER@$DROPLET_HOST"

      - name: Check exit IP
        run: curl --fail --show-error --silent --max-time 30 --socks5-hostname 127.0.0.1:1080 https://ifconfig.me

      - name: Run Playwright through tunnel
        run: >-
          npx playwright test --config=playwright.tunnel.config.js
          playwright/e2e/dua-shpi-shitje.spec.js

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/filter-properties/database.json
          key: filter-properties-db-${{ github.run_id }}
